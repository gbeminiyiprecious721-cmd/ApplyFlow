<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplyFlow form test</title><style>body{font:16px system-ui;max-width:600px;margin:40px auto;padding:20px}label,input,select{display:block;margin:12px 0}input,select{padding:10px;width:100%;box-sizing:border-box}</style><h1>Application form test</h1><p>Neutral test fixture. No employer receives information.</p><form id="test"><label for="name">Full name</label><input id="name" name="full_name" autocomplete="name"><label for="first">First name</label><input id="first" autocomplete="given-name"><label for="email">Email address</label><input id="email" type="email" autocomplete="email"><label for="phone">Phone number</label><input id="phone" type="tel"><label for="country">Country</label><select id="country"><option value="">Choose</option><option>Canada</option><option>Germany</option><option>United States</option></select><label for="visa">Do you need visa sponsorship?</label><input id="visa"><label for="resume">Upload CV</label><input id="resume" type="file"><button type="submit">Submit test</button></form><p id="confirmation" role="status"></p><script>document.getElementById('test').onsubmit=e=>{e.preventDefault();document.getElementById('confirmation').textContent='Test submission received. Reference APPLYFLOW-SANDBOX. No employer application was sent.';};</script></html>
